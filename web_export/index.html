<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>錦繡商途</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "KaiTi", serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ===== 《錦繡商途》簡潔品牌加載畫面(取代 Godot 預設載入畫面) ===== */
#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	z-index: 5;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	background: #000 url("assets/parlor.png") center / cover no-repeat;
	transition: opacity 0.8s ease;
}

#status::before { /* 壓暗底圖 */
	content: "";
	position: absolute;
	inset: 0;
	background: rgba(0, 0, 0, 0.68);
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

.ls-box {
	position: relative;
	z-index: 2;
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 18px;
	width: min(420px, 78vw);
}

.ls-title {
	font-size: clamp(34px, 5vw, 52px);
	letter-spacing: 0.28em;
	text-indent: 0.28em;
	color: #e8c97a;
	text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
}

.ls-subtitle {
	font-size: clamp(12px, 1.4vw, 15px);
	letter-spacing: 0.35em;
	text-indent: 0.35em;
	color: #bfab84;
}

.ls-bar {
	width: 100%;
	height: 10px;
	margin-top: 14px;
	background: rgba(26, 20, 15, 0.9);
	border: 1px solid rgba(115, 92, 56, 0.8);
	border-radius: 2px;
	overflow: hidden;
}

.ls-bar-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #b98f3e, #dbae56);
}

.ls-percent {
	font-size: 13px;
	letter-spacing: 0.15em;
	color: #bfab84;
	font-variant-numeric: tabular-nums;
}

#status-notice {
	display: none;
	position: absolute;
	z-index: 6;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	max-width: 32rem;
	background-color: rgba(91, 57, 67, 0.95);
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}
		</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div class="ls-box">
				<div class="ls-title">錦繡商途</div>
				<div class="ls-subtitle">清末女掌櫃的商海浮沉</div>
				<div class="ls-bar"><div class="ls-bar-fill" id="ls-bar-fill"></div></div>
				<div class="ls-percent" id="ls-percent">0%</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34512592,"index.wasm":43699190},"focusCanvas":true,"gdextensionLibs":[]};
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const barFill = document.getElementById('ls-bar-fill');
	const percent = document.getElementById('ls-percent');

	let initializing = true;

	function hideStatusOverlay() {
		if (!initializing) {
			return;
		}
		initializing = false;
		// 稍候片刻讓玩家看到 100%,再淡出進入遊戲
		setTimeout(() => {
			statusOverlay.classList.add('done');
			setTimeout(() => statusOverlay.remove(), 900);
		}, 400);
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		statusNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] === true,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.min(100, Math.round((current / total) * 100));
					barFill.style.width = pct + '%';
					percent.textContent = pct + '%';
				}
			},
		}).then(hideStatusOverlay, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
