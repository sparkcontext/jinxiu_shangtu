<!-- 手機版網頁強化:由 export preset 的 html/head_include 注入 <head> -->
<script>
(function () {
	// 1. 視口:禁止縮放、覆蓋瀏覽器安全區(瀏海)
	var vp = document.querySelector('meta[name="viewport"]');
	if (vp) {
		vp.setAttribute('content',
			'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
	}
	// 2. 加入主畫面後全螢幕(iOS / Android)
	var metas = {
		'mobile-web-app-capable': 'yes',
		'apple-mobile-web-app-capable': 'yes',
		'apple-mobile-web-app-status-bar-style': 'black-translucent',
		'apple-mobile-web-app-title': '錦繡商途'
	};
	for (var name in metas) {
		var m = document.createElement('meta');
		m.name = name;
		m.content = metas[name];
		document.head.appendChild(m);
	}
	// 3. 手機樣式:鎖定頁面不捲動、無回彈、禁長按選取
	var css = ''
		+ 'html, body { position: fixed; inset: 0; width: 100%; height: 100%;'
		+ ' overscroll-behavior: none; -webkit-user-select: none; user-select: none;'
		+ ' -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }'
		+ '#rotate-overlay { display: none; position: fixed; inset: 0; z-index: 9999;'
		+ ' background: #1a1512; color: #e8d5a8; font-family: sans-serif;'
		+ ' flex-direction: column; justify-content: center; align-items: center;'
		+ ' text-align: center; padding: 2rem; box-sizing: border-box;'
		+ ' font-size: 1.1rem; line-height: 2; }'
		+ '#rotate-overlay .phone { display: inline-block; width: 28px; height: 48px;'
		+ ' border: 3px solid #e8d5a8; border-radius: 6px; margin-bottom: 1rem;'
		+ ' animation: jxst-rotate 1.6s ease-in-out infinite; }'
		+ '@keyframes jxst-rotate { 0%,20% { transform: rotate(0deg); }'
		+ ' 60%,100% { transform: rotate(90deg); } }'
		+ '@media (orientation: portrait) and (pointer: coarse) {'
		+ ' #rotate-overlay { display: flex; } }';
	var style = document.createElement('style');
	style.textContent = css;
	document.head.appendChild(style);
	// 4. 直向握持時提示旋轉成橫向;Android 首次觸控時進入全螢幕
	document.addEventListener('DOMContentLoaded', function () {
		var overlay = document.createElement('div');
		overlay.id = 'rotate-overlay';
		overlay.innerHTML = '<span class="phone"></span>'
			+ '請將裝置旋轉為橫向遊玩<br>Rotate your device to landscape';
		document.body.appendChild(overlay);
		var isAndroid = /Android/i.test(navigator.userAgent);
		if (isAndroid && document.documentElement.requestFullscreen) {
			var unlock = function () {
				document.removeEventListener('touchend', unlock);
				try {
					document.documentElement.requestFullscreen().catch(function () {});
				} catch (e) {}
			};
			document.addEventListener('touchend', unlock);
		}
	});
})();
</script>
