<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>錦繡商途 · 標題畫面預覽</title>
<style>
  :root {
    --gold: #e8c97a;
    --gold-dim: #bfab84;
    --ink: #e0d6bf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "KaiTi", serif;
    color: var(--ink);
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw; height: 100vh;
    background: url("assets/backgrounds/parlor.png") center / cover no-repeat;
  }
  .stage::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.55);
  }
  .vignette {
    position: absolute; inset: 0; z-index: 2;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  .character {
    position: absolute; z-index: 3;
    right: 1%; top: 3%; bottom: 3%;
    width: 37%;
    background: url("assets/characters/shen_yunjin.png") center bottom / contain no-repeat;
  }

  .title-block {
    position: absolute; z-index: 4;
    left: 7%; top: 15%; bottom: 12%;
    width: 55%;
    display: flex; flex-direction: column; gap: 10px;
  }
  .presented {
    font-size: clamp(13px, 1.4vw, 18px);
    letter-spacing: 0.4em;
    color: var(--gold-dim);
  }
  .title {
    font-size: clamp(48px, 6.7vw, 86px);
    letter-spacing: 0.18em;
    color: var(--gold);
    text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.6);
    line-height: 1.15;
  }
  .divider {
    margin: 4px 0;
    height: 1px;
    background: linear-gradient(90deg, rgba(232,201,122,0.6), rgba(232,201,122,0.05));
  }
  .subtitle {
    font-size: clamp(15px, 1.7vw, 22px);
    color: rgba(224, 214, 191, 0.9);
    letter-spacing: 0.15em;
  }
  .gap { height: 40px; }

  .btn {
    width: 280px;
    background: rgba(23, 18, 13, 0.82);
    border: 1px solid rgba(140, 112, 66, 0.9);
    border-radius: 3px;
    color: var(--gold);
    text-align: center;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .btn:hover {
    background: rgba(43, 33, 23, 0.92);
    border-color: var(--gold);
    color: #ffeeb2;
  }
  .btn.start { padding: 14px 0; font-size: 26px; letter-spacing: 0.35em; text-indent: 0.35em; }
  .btn.quit  { padding: 11px 0; font-size: 20px; letter-spacing: 0.35em; text-indent: 0.35em; color: var(--gold-dim); }

  .footer {
    position: absolute; z-index: 4;
    left: 7%; bottom: 2%;
    font-size: 14px;
    letter-spacing: 0.15em;
    color: rgba(153, 140, 115, 0.8);
  }

  @media (max-width: 760px) {
    .character { opacity: 0.35; width: 60%; right: -6%; }
    .title-block { width: 86%; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="character"></div>
  <div class="vignette"></div>

  <div class="title-block">
    <div class="presented">錦 記 綢 緞 莊 · 敬 呈</div>
    <div class="title">錦 繡 商 途</div>
    <div class="divider"></div>
    <div class="subtitle">—— 清末女掌櫃的商海浮沉 ——</div>
    <div class="gap"></div>
    <div class="btn start">開 始</div>
    <div class="btn quit">離 開</div>
  </div>

  <div class="footer">M1 雛形 · 第一章 客廳會談 · 碼頭驗貨 · 酒宴談判</div>
</div>
</body>
</html>
