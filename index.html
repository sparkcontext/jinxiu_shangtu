<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0" />
  <title>錦繡商途 · 開場</title>
  <style>
    :root {
      --gold: #d4a24e;
      --gold-bright: #f0c978;
      --crimson: #8e1f2f;
      --ink: #140808;
      /* 主題相關(夜) */
      --title-color: #f3e3c2;
      --title-glow-1: rgba(212, 162, 78, 0.45);
      --title-glow-2: rgba(212, 162, 78, 0.2);
      --subtitle-color: rgba(212, 162, 78, 0.85);
      --btn-border: rgba(212, 162, 78, 0.65);
      --btn-color: var(--gold-bright);
      --btn-bg: rgba(20, 8, 8, 0.35);
      --btn-hover-bg: rgba(142, 31, 47, 0.55);
      --btn-hover-color: #fff2d9;
      --hint-color: rgba(212, 162, 78, 0.45);
      --switch-color: rgba(212, 162, 78, 0.75);
      --switch-active-bg: rgba(142, 31, 47, 0.6);
    }

    /* 白天金絲緞 */
    :root[data-theme="day"] {
      --title-color: #6e2b16;
      --title-glow-1: rgba(255, 246, 222, 0.8);
      --title-glow-2: rgba(201, 158, 90, 0.35);
      --subtitle-color: rgba(110, 43, 22, 0.8);
      --btn-border: rgba(150, 105, 40, 0.7);
      --btn-color: #7a4d12;
      --btn-bg: rgba(255, 248, 230, 0.3);
      --btn-hover-bg: rgba(201, 158, 90, 0.3);
      --btn-hover-color: #5c3808;
      --hint-color: rgba(110, 60, 25, 0.55);
      --switch-color: rgba(122, 77, 18, 0.8);
      --switch-active-bg: rgba(201, 158, 90, 0.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "KaiTi", "DFKai-SB", serif;
      color: var(--gold);
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
    }

    /* ---- 暗角,讓視線集中到中央 ---- */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 40%, rgba(8, 3, 3, 0.55) 78%, rgba(5, 2, 2, 0.9) 100%);
      z-index: 2;
      opacity: 1;
      transition: opacity 1s ease;
    }
    html[data-theme="day"] #vignette { opacity: 0; }

    /* 白天的柔光暈(取代暗角) */
    #vignette-day {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 45%, rgba(150, 105, 45, 0.22) 80%, rgba(110, 70, 25, 0.42) 100%);
      z-index: 2;
      opacity: 0;
      transition: opacity 1s ease;
    }
    html[data-theme="day"] #vignette-day { opacity: 1; }

    /* ---- 中央內容 ---- */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2rem;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #overlay.show { opacity: 1; }
    #overlay.leaving { opacity: 0; transition: opacity 0.9s ease; }

    #title-block {
      display: flex;
      align-items: center;
      gap: 2rem;
      user-select: none;
    }

    .seal {
      width: 3.2rem;
      height: 3.2rem;
      border: 2px solid var(--crimson);
      background: rgba(142, 31, 47, 0.85);
      color: #f5e6d0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      line-height: 1;
      box-shadow: 0 0 18px rgba(142, 31, 47, 0.6);
      transform: rotate(3deg);
    }

    #game-title {
      writing-mode: vertical-rl;
      font-size: clamp(3.4rem, 11vh, 6.4rem);
      font-weight: 700;
      letter-spacing: 0.35em;
      color: var(--title-color);
      text-shadow:
        0 0 24px var(--title-glow-1),
        0 0 60px var(--title-glow-2);
      transition: color 1s ease, text-shadow 1s ease;
    }

    #subtitle {
      font-size: clamp(0.95rem, 2.2vh, 1.25rem);
      letter-spacing: 0.55em;
      text-indent: 0.55em;
      color: var(--subtitle-color);
      transition: color 1s ease;
    }

    #divider {
      width: min(320px, 50vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.7;
    }

    #enter-btn {
      cursor: pointer;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--btn-color);
      font-family: inherit;
      font-size: 1.15rem;
      letter-spacing: 0.6em;
      text-indent: 0.6em;
      padding: 0.85rem 2.6rem;
      transition: all 0.35s ease, color 1s ease, border-color 1s ease;
      backdrop-filter: blur(2px);
    }
    #enter-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-border);
      box-shadow: 0 0 26px var(--title-glow-1);
      color: var(--btn-hover-color);
    }

    #hint {
      position: fixed;
      bottom: 2.2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      color: var(--hint-color);
      z-index: 3;
      pointer-events: none;
      transition: color 1s ease;
    }

    /* ---- 日夜切換 ---- */
    #theme-switch {
      position: fixed;
      top: 1.6rem;
      right: 1.8rem;
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    #theme-switch button {
      cursor: pointer;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 1px solid var(--btn-border);
      background: transparent;
      color: var(--switch-color);
      font-family: inherit;
      font-size: 1rem;
      line-height: 1;
      transition: all 0.35s ease, color 1s ease, border-color 1s ease;
    }
    #theme-switch button.active {
      background: var(--switch-active-bg);
      box-shadow: 0 0 14px var(--title-glow-1);
    }

    /* ---- 轉場黑幕 ---- */
    #fade {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
      z-index: 10;
    }
    #fade.on { opacity: 1; pointer-events: all; }
  </style>
  <script>
    // 首繪前設定初始氛圍:URL 參數 > localStorage > 夜,避免載入時顏色跳變
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t !== 'day' && t !== 'night') {
        try { t = localStorage.getItem('jinxiu-theme'); } catch (e) { t = null; }
      }
      document.documentElement.dataset.theme = (t === 'day' || t === 'night') ? t : 'night';
    })();
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="vignette-day"></div>

  <div id="theme-switch" role="group" aria-label="日夜氛圍切換">
    <button id="theme-day" type="button" title="白天金絲緞">日</button>
    <button id="theme-night" type="button" class="active" title="夜晚燈籠紅">夜</button>
  </div>

  <div id="overlay">
    <div id="title-block">
      <div id="game-title">錦繡商途</div>
      <div class="seal">錦</div>
    </div>
    <div id="divider"></div>
    <div id="subtitle">清末女商人 · 談判經商傳奇</div>
    <button id="enter-btn">進入遊戲</button>
  </div>

  <div id="hint">移動滑鼠 · 絲綢隨風而動</div>
  <div id="fade"></div>

  <script type="module" src="/src/opening.js"></script>
</body>
</html>
